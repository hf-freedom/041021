<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸 - 网页版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            margin-top: 10px;
        }
        #gameCanvas {
            border: 4px solid #2d5016;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(180deg, rgba(139, 90, 43, 0.95) 0%, rgba(101, 67, 33, 0.95) 100%);
            border-bottom: 3px solid #5d3a1a;
            display: flex;
            align-items: center;
            padding: 5px 10px;
            gap: 10px;
        }
        #sunCounter {
            background: linear-gradient(180deg, #ffdd00 0%, #ffaa00 100%);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #8b4513;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 2px solid #cc8800;
        }
        #plantCards {
            display: flex;
            gap: 5px;
            flex: 1;
        }
        .plantCard {
            width: 60px;
            height: 70px;
            background: linear-gradient(180deg, #c4a574 0%, #a08050 100%);
            border: 2px solid #5d3a1a;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .plantCard:hover:not(.disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .plantCard.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .plantCard.selected {
            border-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        .plantCard .icon {
            font-size: 28px;
        }
        .plantCard .cost {
            font-size: 12px;
            color: #ffdd00;
            font-weight: bold;
        }
        .plantCard .cooldownOverlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            transition: height 0.1s;
        }
        #levelInfo {
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }
        #waveProgress {
            width: 150px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #666;
        }
        #waveProgressBar {
            height: 100%;
            background: linear-gradient(90deg, #ff4444 0%, #ff8800 50%, #00ff00 100%);
            transition: width 0.3s;
        }
        #menuScreen, #gameOverScreen, #victoryScreen, #levelSelectScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .menuTitle {
            font-size: 48px;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            margin-bottom: 30px;
        }
        .menuBtn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .menuBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
        .levelBtn {
            width: 80px;
            height: 80px;
            font-size: 24px;
            margin: 10px;
        }
        .levelBtn.locked {
            background: linear-gradient(180deg, #666 0%, #444 100%);
            cursor: not-allowed;
        }
        .levelBtn.locked:hover {
            transform: none;
            box-shadow: none;
        }
        #levelButtons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 500px;
        }
        .resultText {
            font-size: 24px;
            color: white;
            margin: 20px 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="ui">
            <div id="sunCounter">☀️ 50</div>
            <div id="plantCards"></div>
            <div id="levelInfo">关卡 1</div>
            <div id="waveProgress">
                <div id="waveProgressBar" style="width: 0%"></div>
            </div>
        </div>
        
        <div id="menuScreen">
            <div class="menuTitle">🌻 植物大战僵尸 🧟</div>
            <button class="menuBtn" id="startBtn">开始游戏</button>
            <button class="menuBtn" id="selectLevelBtn">选择关卡</button>
        </div>
        
        <div id="levelSelectScreen" class="hidden">
            <div class="menuTitle">选择关卡</div>
            <div id="levelButtons"></div>
            <button class="menuBtn" id="backToMenuBtn">返回</button>
        </div>
        
        <div id="gameOverScreen" class="hidden">
            <div class="menuTitle" style="color: #ff4444;">💀 游戏失败 💀</div>
            <div class="resultText">僵尸吃掉了你的脑子！</div>
            <button class="menuBtn" id="retryBtn">重新尝试</button>
            <button class="menuBtn" id="menuBtn">返回菜单</button>
        </div>
        
        <div id="victoryScreen" class="hidden">
            <div class="menuTitle" style="color: #ffdd00;">🎉 胜利！ 🎉</div>
            <div class="resultText" id="victoryText">恭喜通关！</div>
            <button class="menuBtn" id="nextLevelBtn">下一关</button>
            <button class="menuBtn" id="menuBtn2">返回菜单</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
